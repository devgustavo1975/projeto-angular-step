<!-- app.component.html -->
<form #loginForm (ngSubmit)="login()">
  <input #email type="email" name="email" placeholder="E-mail" />
  <input type="password" name="password" placeholder="Senha" />
  <button type="submit">Entrar</button>

  <p *ngIf="email && !email.validity.valid">
    E-mail inválido
  </p>
</form>
